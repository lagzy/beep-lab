; BEEP//1 device player — ESP32 WROOM dev board
; wiring:
;   passive buzzer  +  -> D4  (GPIO4)
;   passive buzzer  -  -> GND
;   push button     leg1 -> D14 (GPIO14)
;   push button     leg2 -> GND
;
; build:  pio run -d firmware
; flash:  pio run -d firmware -t upload --upload-port COMx

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -DCORE_DEBUG_LEVEL=0
