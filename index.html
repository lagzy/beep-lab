<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BEEP//1 — 1-bit Beeper Studio for ESP32</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fff'/%3E%3Cpath d='M0 11h3V5h3v6h4V5h3v6h3' stroke='%23111' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vt323/index.css">
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
<style>
:root{
  --ink:#111111; --paper:#ffffff; --bg:#e9e9e5; --line:#dedbd5; --mute:#7c7a74;
  --acc:#e23d28; --soft:#f4f4f1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12px; -webkit-font-smoothing:none;
  padding:14px 14px 40px;
}
.wrap{max-width:1240px;margin:0 auto}
.panel{background:var(--paper);border:2px solid var(--ink);padding:12px}
.mono-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* ---------- HEADER ---------- */
header{display:flex;align-items:stretch;gap:0;border:2px solid var(--ink);background:var(--paper);margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;padding:10px 14px;border-right:2px solid var(--ink);flex:0 0 auto}
.mark{width:34px;height:34px;border:2px solid var(--ink);background:#fff;display:block;flex:0 0 auto}
h1{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1}
h1 span{color:var(--acc)}
.sub{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.transport{display:flex;align-items:center;gap:8px;padding:10px 14px;flex:1 1 auto;flex-wrap:wrap}
.spacer{flex:1 1 auto}
.lcd{border:2px solid var(--ink);background:var(--ink);color:#fff;padding:5px 12px;min-width:132px;text-align:center}
.lcd b{font-family:'VT323',monospace;font-size:26px;line-height:1;letter-spacing:.06em;display:block;font-weight:400}
.lcd i{font-style:normal;font-size:8px;letter-spacing:.16em;color:#9a9a94}
.lcd.red{background:var(--acc);border-color:var(--acc)}

/* ---------- BUTTONS ---------- */
button{font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 12px;cursor:pointer;
  transition:none;white-space:nowrap}
button:hover{background:var(--ink);color:#fff}
button:active{transform:translate(1px,1px)}
button.pri{background:var(--ink);color:#fff;min-width:104px}
button.pri:hover{background:var(--acc);border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:7px 9px;font-size:9px}
button[disabled]{opacity:.4;cursor:not-allowed}
.chk{display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  border:2px solid var(--ink);padding:8px 10px;cursor:pointer;user-select:none;background:#fff}
.chk input{appearance:none;width:12px;height:12px;border:2px solid var(--ink);background:#fff;cursor:pointer}
.chk input:checked{background:var(--acc);border-color:var(--acc)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;padding:11px 14px;margin-bottom:10px}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl .row{display:flex;align-items:center;gap:8px}
.ctl output{font-family:'VT323',monospace;font-size:19px;line-height:1;min-width:52px;letter-spacing:.04em}
input[type=range]{appearance:none;width:120px;height:14px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:16px;background:var(--acc);border:2px solid var(--ink);margin-top:-6px}
input[type=range]::-moz-range-track{height:4px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:10px;height:14px;background:var(--acc);border:2px solid var(--ink);border-radius:0}
select,input[type=number]{font-family:inherit;font-size:11px;border:2px solid var(--ink);background:#fff;padding:6px 6px;color:var(--ink)}
input[type=number]{width:56px;text-align:center}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.sep{width:2px;background:var(--ink);align-self:stretch}

/* ---------- STAGE ---------- */
.gridwrap{display:flex;align-items:flex-start;border:2px solid var(--ink);background:#fff;overflow:hidden}
.labels{flex:0 0 auto;border-right:2px solid var(--ink);background:#fff}
.scroller{flex:1 1 auto;overflow-x:auto;overflow-y:hidden;scrollbar-color:var(--ink) #fff}
.scroller::-webkit-scrollbar{height:12px}
.scroller::-webkit-scrollbar-track{background:#fff;border-top:2px solid var(--ink)}
.scroller::-webkit-scrollbar-thumb{background:var(--ink)}
canvas{display:block}
#grid{cursor:crosshair;touch-action:none}

/* ---------- BOTTOM ---------- */
.bottom{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px}
.status{font-size:10px;letter-spacing:.06em;color:var(--mute);min-height:14px}
.status b{color:var(--ink);font-weight:700}
.dl{display:flex;gap:6px;flex-wrap:wrap}
.codebox{margin-top:10px;border:2px solid var(--ink);background:#0f0f0f;display:none}
.codebox.open{display:block}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid var(--ink);background:#0f0f0f}
.codebox .bar span{color:#8a8a84;font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.codebox button{background:#0f0f0f;color:#fff;border-color:#fff;padding:5px 9px;font-size:9px}
.codebox button:hover{background:#fff;color:#0f0f0f}
pre{color:#e8e8e4;font-family:'Space Mono',monospace;font-size:11.5px;line-height:1.55;padding:14px;overflow:auto;max-height:330px;white-space:pre;margin:0}
.hint{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:10px;text-align:center;line-height:1.9}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
  border:2px solid var(--ink);padding:10px 16px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--acc);border-color:var(--acc)}
.note-panel{margin-top:10px;display:none;align-items:center;gap:14px;flex-wrap:wrap}

/* ---------- PROJECT RAIL ---------- */
.proj-rail{display:flex;flex-direction:column;gap:8px;padding:10px 11px;border:2px solid var(--ink);background:var(--paper);width:212px;align-self:flex-end}
.proj-rail[hidden]{display:none}
.rail-head{display:flex;align-items:center;gap:6px;justify-content:space-between}
.rail-hct{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rail-hct button{padding:6px 9px;font-size:9px}
.rail-list{border:2px solid var(--ink);background:#fff;max-height:208px;overflow:auto}
.rail-list::-webkit-scrollbar{width:10px}
.rail-list::-webkit-scrollbar-track{background:#fff}
.rail-list::-webkit-scrollbar-thumb{background:var(--ink)}
.proj-item{display:flex;align-items:center;gap:8px;padding:8px 9px;cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
.proj-item:hover{background:var(--soft)}
.proj-item.cur{background:#fff;border-left:3px solid var(--acc);padding-left:6px}
.proj-item .pname{flex:1 1 auto;min-width:0;font-family:'VT323',monospace;font-size:15px;line-height:1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-item .pmod{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.proj-item .pact{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);padding:2px 5px;background:var(--paper)}
.proj-item .pmenu{position:relative;width:0;height:0}
.proj-item .pmenu menu{position:absolute;right:0;top:100%;z-index:50;min-width:150px;background:var(--paper);border:2px solid var(--ink);padding:4px 0;display:none}
.proj-item .pmenu menu.show{display:block}
.proj-item .pmenu button{display:block;width:100%;text-align:left;border:none;background:var(--paper);color:var(--ink);font-family:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.proj-item .pmenu button:hover{background:var(--ink);color:#fff}
.rail-foot .hint{font-size:8px;line-height:1.5;text-align:left;margin-top:0}

/* ---------- NOTE INSPECTOR (side panel) ---------- */
.stage-row{display:flex;align-items:flex-start;gap:10px}
.stage-row .gridwrap{flex:1 1 auto;min-width:0}
.note-rail{flex:0 0 258px;display:flex;flex-direction:column;gap:8px;padding:10px 11px;border:2px solid var(--ink);background:var(--paper);max-height:560px}
.note-rail[hidden]{display:none}
.note-rail .nfld{display:flex;flex-direction:column;gap:3px}
.note-empty{padding:16px 8px;font-size:10px;letter-spacing:.04em;color:var(--mute);line-height:1.7}
.note-form{display:flex;flex-direction:column;gap:12px;padding:4px 2px}
.note-form label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.note-form .nm{font-family:'VT323',monospace;font-size:22px;line-height:1}
.note-form .row{display:flex;align-items:center;gap:8px}
.note-form input[type=range]{width:118px}
.note-form input[type=number]{width:64px}
.note-form .nswatch{width:28px;height:28px;border:2px solid var(--ink);cursor:pointer;padding:0}
.note-form .nswatch:hover{outline:2px solid var(--acc);outline-offset:1px}
@media(max-width:900px){
  .stage-row{flex-wrap:wrap}
  .note-rail{flex:1 1 100%;max-height:none}
}
.note-panel .fld{display:flex;flex-direction:column;gap:4px}
.note-panel label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.note-panel input[type=number]{width:64px}
.note-panel input[type=range]{width:110px}
.note-panel .nm{font-family:'VT323',monospace;font-size:22px;line-height:1}
@media(max-width:760px){
  .brand{border-right:none;border-bottom:2px solid var(--ink);width:100%}
  header{flex-wrap:wrap}
  input[type=range]{width:88px}
}

/* ---------- SIMPLE (kid-friendly) vs ADVANCED ---------- */
body:not(.simple) .simple-only{display:none !important}
body.simple .pro-only{display:none !important}
body.simple{font-size:14px}
body.simple button{font-size:15px;letter-spacing:.05em;padding:14px 18px}
body.simple button.sm{padding:12px 14px;font-size:13px}
body.simple button.pri{min-width:160px;font-size:18px}
body.simple .controls{gap:18px 30px;padding:16px}
body.simple .ctl .mono-lbl{font-size:12px}
body.simple .ctl output{font-size:26px}
body.simple input[type=range]{width:170px;height:26px}
body.simple input[type=range]::-webkit-slider-runnable-track{height:8px}
body.simple input[type=range]::-webkit-slider-thumb{width:24px;height:28px;margin-top:-11px}
body.simple input[type=range]::-moz-range-track{height:8px}
body.simple input[type=range]::-moz-range-thumb{width:22px;height:26px}
body.simple .lcd b{font-size:32px}
body.simple .hint{font-size:11px;line-height:2.1}
body.simple .chk{font-size:12px;padding:11px 13px}
body.simple .rail-head .mono-lbl{font-size:12px}

/* colour palette dots */
.palette{display:flex;flex-wrap:wrap;gap:7px}
.pdot{width:28px;height:28px;border:2px solid var(--ink);padding:0;cursor:pointer}
.pdot:hover{outline:3px solid var(--acc);outline-offset:1px}
.pdot.sel{outline:3px solid var(--acc);outline-offset:1px;border-color:var(--acc)}

/* big +- steppers */
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;padding:9px 0;text-align:center;font-size:20px;line-height:1}
.stepper .val{font-family:'VT323',monospace;font-size:28px;line-height:1;min-width:34px;text-align:center}

/* friendly sound readout */
.sound-badge{display:flex;align-items:center;gap:10px}
.sound-badge .glyph{font-size:24px}

/* keep compact controls compact even in simple mode */
body.simple .pdot{width:30px;height:30px;padding:0;font-size:0}
body.simple .stepper button,
body.simple .stepper button.sm{width:48px;padding:10px 0;font-size:22px;line-height:1}

@media(max-width:760px){
  body.simple input[type=range]{width:118px}
  body.simple button{padding:12px 14px}
  body.simple button.pri{min-width:120px}
  body.simple .pdot{width:26px;height:26px}
}

</head>
<body class="simple">
<div class="wrap">

  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" fill="#fff"/>
        <circle cx="17" cy="17" r="10" fill="none" stroke="#111" stroke-width="2"/>
        <circle cx="17" cy="17" r="3" fill="#111"/>
        <path d="M2 12h3v5h3v-8h3v11h3V9h3v16" fill="none" stroke="#111" stroke-width="0"/>
        <path d="M1 21h3v-8h3v12h3V13" fill="none" stroke="#111" stroke-width="2"/>
        <path d="M33 13h-3v8h-3V9h-3" fill="none" stroke="#e23d28" stroke-width="2"/>
      </svg>
      <div>
        <h1>BEEP<span>//</span>1</h1>
        <div class="sub">1-bit beeper studio &middot; esp32 export</div>
      </div>
    </div>
    <div class="transport">
      <button id="playBtn" class="pri">&#9654; PLAY</button>
      <button id="stopBtn" class="sm">&#9632; STOP</button>
      <label class="chk"><input type="checkbox" id="loopChk" checked> LOOP</label>
      <div class="spacer"></div>
      <div class="lcd" id="posLcd"><b>01/32</b><i>STEP</i></div>
      <div class="lcd" id="lenLcd"><b>1.71s</b><i>LENGTH</i></div>
      <button id="uiBtn" class="sm" title="switch between Simple and Advanced">&#9881; ADVANCED</button>
    </div>
  </header>

  <div class="panel controls">
    <div class="ctl">
      <span class="mono-lbl"><span class="simple-only">Speed</span><span class="pro-only">Tempo</span></span>
      <div class="row"><input type="range" id="bpm" min="40" max="320" value="150"><output id="bpmOut">150 BPM</output></div>
    </div>
    <div class="ctl">
      <span class="mono-lbl"><span class="simple-only">Song length</span><span class="pro-only">Steps (16th)</span></span>
      <div class="row"><select id="steps">
        <option value="16">16</option><option value="32" selected>32</option><option value="48">48</option>
        <option value="64">64</option><option value="96">96</option><option value="128">128</option>
      </select><output id="stepsOut">2 BARS</output></div>
      <div class="row"><input type="range" id="stepsR" min="1" max="128" step="1" value="32" title="track length"></div>
    </div>
    <div class="ctl pro-only">
      <span class="mono-lbl">Note length (gate)</span>
      <div class="row"><input type="range" id="gate" min="5" max="100" value="85"><output id="gateOut">85 %</output></div>
    </div>
    <div class="ctl pro-only">
      <span class="mono-lbl">Buzzer type</span>
      <div class="row"><output style="font-size:10px;letter-spacing:.1em">PASSIVE piezo</output></div>
    </div>
    <div class="ctl pro-only">
      <span class="mono-lbl">Duty / timbre</span>
      <div class="row"><select id="duty">
        <option value="0.125">12.5 % thin</option>
        <option value="0.25">25 % hollow</option>
        <option value="0.5" selected>50 % square</option>
        <option value="0.75">75 % fat</option>
      </select></div>
    </div>
    <div class="ctl">
      <span class="mono-lbl">Volume (master)</span>
      <div class="row"><input type="range" id="vol" min="0" max="100" value="75"><output id="volOut">75</output></div>
    </div>
    <div class="sep pro-only"></div>
    <div class="ctl pro-only">
      <span class="mono-lbl">Buzzer pin</span>
      <div class="row"><input type="number" id="pin" min="1" max="48" value="4"></div>
    </div>
    <div class="sep"></div>
    <div class="ctl">
      <span class="mono-lbl">Edit</span>
      <div class="grp">
        <button class="sm pro-only" id="rotL" title="shift left">&laquo;</button>
        <button class="sm pro-only" id="rotR" title="shift right">&raquo;</button>
        <button class="sm pro-only" id="octD" title="octave down">OCT&minus;</button>
        <button class="sm pro-only" id="octU" title="octave up">OCT+</button>
        <button class="sm pro-only" id="randBtn">DICE</button>
        <button class="sm" id="demoBtn">&#127925; DEMO</button>
        <button class="sm" id="clearBtn">&#128465; CLEAR</button>
      </div>
    </div>      <button id="plLibBtn" class="sm pro-only" title="open project library">&#9776; PROJECTS</button>
      <button id="noteRailBtn" class="sm" title="show/hide note settings">&#9834; NOTES</button>
      <span class="mono-lbl" id="plCurrentLbl" style="display:none">CURRENT</span>
      <span class="mono-lbl" id="plCurrentName" style="display:none;font-family:'VT323',monospace;font-size:17px;line-height:1;letter-spacing:.02em"></span>

      </div>

  <div class="stage-row">
    <div class="gridwrap">
      <div class="labels"><canvas id="labels"></canvas></div>
      <div class="scroller" id="scroller"><canvas id="grid"></canvas></div>
    </div>

    <aside class="note-rail" id="noteRail">
      <div class="rail-head">
        <span class="mono-lbl">NOTE SETTINGS</span>
        <div class="rail-hct">
          <button class="sm" id="noteRailClose" title="hide the note panel">CLOSE</button>
        </div>
      </div>
      <div class="note-empty" id="noteEmpty">click a note on the grid to edit its sound, length and colour</div>
      <div class="note-form" id="noteForm" hidden>
        <div class="nfld"><label>Colour</label><div class="palette" id="nPalette"></div></div>
        <div class="nfld"><label>Sound</label><div class="sound-badge"><span class="glyph">&#9834;</span><span class="nm" id="nPitch">&mdash;</span></div></div>
        <div class="nfld"><label><span class="simple-only">Pitch</span><span class="pro-only">Frequency (Hz)</span></label>
          <div class="row"><input type="range" id="nFreqR" min="20" max="4000" step="1"><input type="number" id="nFreq" class="pro-only" min="20" max="12000" step="1"></div>
        </div>
        <div class="nfld pro-only"><label>Start step</label><input type="number" id="nStep" min="1"></div>
        <div class="nfld"><label>Length</label>
          <div class="stepper">
            <button class="sm" id="nLenMinus" title="shorter">&#8722;</button>
            <span class="val" id="nLenVal">1</span>
            <button class="sm" id="nLenPlus" title="longer">+</button>
            <input type="number" id="nLen" class="pro-only" min="1" step="1">
          </div>
        </div>
        <div class="nfld"><label>Volume</label><div class="row"><input type="range" id="nVol" min="0" max="100" value="100"><output id="nVolOut">100</output></div></div>
        <button class="sm" id="nDel">&#128465; REMOVE NOTE</button>
      </div>
    </aside>
  </div>

  <aside class="panel proj-rail" id="projRail" hidden>
    <div class="rail-head">
      <span class="mono-lbl">PROJECT LIBRARY</span>
      <div class="rail-hct">
        <button class="sm" id="plCloseBtn">CLOSE</button>
        <button class="sm" id="plNewBtn">NEW</button>
        <button class="sm" id="plExportBtn" title="export current project as a portable .json">EXPORT</button>
        <button class="sm" id="plImportBtn" title="import a saved project (creates a new project)">IMPORT</button>
      </div>
    </div>
    <div class="rail-list" id="plList"></div>
    <div class="rail-foot">
      <span class="hint" id="plFoot">projects are saved in this browser&rsquo;s local storage &mdash; they persist across app updates as long as this file keeps the same origin and key</span>
    </div>
    <input type="file" id="plImportFile" accept=".json,.b1p" style="display:none">
  </aside>


  <div class="panel bottom" style="margin-top:10px">
    <div class="status" id="status">&mdash;</div>
    <div class="dl">
      <button id="dlMp3">&#8615; SAVE MP3</button>
      <button id="dlWav">&#8615; SAVE WAV</button>
      <button id="dlIno" class="on pro-only">&#8615; ARDUINO .INO</button>
      <button id="dlJson" class="pro-only">&#8615; .JSON</button>
      <button id="impBtn" class="pro-only">&#8613; IMPORT</button>
      <button id="codeBtn" class="pro-only">&lt;/&gt; CODE</button>
    </div>
    <input type="file" id="impFile" accept=".json,.ino,.txt" style="display:none">
  </div>

  <div class="codebox pro-only" id="codeBox">
    <div class="bar"><span id="codeName">beep1_song.ino</span><button id="copyBtn">COPY</button></div>
    <pre id="codeOut"></pre>
  </div>

  <div class="hint simple-only">
    tap the grid to add a note &middot; tap a note to change its sound, colour or length &middot; drag a note to move it &middot; drag its edge to make it longer &middot; <b>SPACE</b> to play / stop
  </div>
  <div class="hint pro-only">
    click = paint note &middot; drag = lay a stroke of notes &middot; click a note = move it &middot; drag a note corner = resize length &middot; shift+drag = volume &middot; right-click = erase note &middot;
    stack another pitch on the same step = chord (playback arpeggios the voices) &middot; edit each note&rsquo;s frequency &amp; colour in the NOTE SETTINGS panel &middot; click ruler = set start &middot; <b>SPACE</b> play/stop &middot; <b>&larr;&rarr;</b> move start &middot; <b>L</b> loop &middot; <b>DEL</b> delete / clear &middot; <b>P</b> project library

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ============ CONSTANTS ============ */
const NM   = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const LOW  = 48, HIGH = 84;              // C3 .. C6
const ROWS = HIGH - LOW + 1;             // 37
const ROWH = 13, RULERH = 26, LABELW = 64, MAXSTEPS = 128;
const SR_EXPORT = 44100;
const ARP_SEC = 0.006;   // chord arpeggio swap rate — matches ARP_MS in the exported .ino

/* ============ STATE ============ */
const S = { steps:32, bpm:150, gate:.85, duty:.5, vol:.75, pin:4, loop:true };
let activeNotes = [];       // note list: {id, step, len, midi, vol, freq, color}
let nextNoteId = 1;
let cellW = 22;
let hover = null, cursorStep = 0, playStep = -1;
let playing = false;
let selectedNote = null;
let dragState = null;

/* per-note colours (index stored on each note, cycles on creation) */
const PALETTE = ['#e23d28','#e6973a','#c9b021','#5aa64b','#2f9e8f','#2f7fd0','#6b57c9','#b0419e','#8a6a4a','#2b2b2b','#0f8a5f','#c94f7c'];
let nextColor = 0;
function nextPaletteColor(){ const c = nextColor % PALETTE.length; nextColor++; return c; }
function noteColor(c){ const i = ((Math.round(c) % PALETTE.length) + PALETTE.length) % PALETTE.length; return PALETTE[i]; }

/* ============ PROJECT LIBRARY ============ */
const PL = {
  key: 'beep1.projects.v1',
  currentId: null,
  dirtyT: null,
  list: []
};
function nowLabel(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return 'Project ' + yyyy + '-' + mm + '-' + dd + ' ' + hh + ':' + mi;
}
function uid(){
  return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
}
function sanitizeName(raw){
  let n = (raw || '').trim();
  n = n.replace(/\s+/g, ' ');
  if (n.length === 0) n = nowLabel();
  if (n.length > 32) n = n.slice(0, 32);
  return n;
}
function snapProject(){
  // flattened per-step pattern kept for older files; activeNotes is the source of truth
  const pattern = new Array(S.steps).fill(-1);
  for (const n of activeNotes){
    for (let k = 0; k < n.len; k++){
      const s = Math.round(n.step) + k;
      if (s >= 0 && s < S.steps) pattern[s] = n.midi;
    }
  }
  return {
    id: PL.currentId,
    name: sanitizeName($('plCurrentName') ? $('plCurrentName').textContent : ''),
    bpm: S.bpm, steps: S.steps, gate: S.gate, duty: S.duty, pin: S.pin, loop: S.loop,
    pattern: pattern,
    activeNotes: activeNotes.map(n => ({ step: n.step, len: n.len, midi: n.midi, vol: (n.vol == null ? 1 : n.vol), freq: (n.freq > 0 ? +n.freq.toFixed(3) : 0), color: Math.round(n.color) || 0 })),
    updated: Date.now()
  };
}
function markDirty(){

  PL.dirtyT = setTimeout(() => saveCurrentToLibrary(), 700);
}
function saveCurrentToLibrary(){
  if (PL.currentId == null) return;
  const snap = snapProject();
  const lib = loadLibrary();
  const idx = lib.findIndex(p => p.id === PL.currentId);
  if (idx >= 0) lib[idx] = snap;
  else lib.unshift(snap);
  PL.list = lib;
  writeLibrary(lib);
  renderLibrary();
}
function renameCurrent(newName){
  const n = sanitizeName(newName);
  if (n.length === 0) return false;
  if (PL.currentId == null) return false;
  const lib = loadLibrary();
  const p = lib.find(p => p.id === PL.currentId);
  if (!p) return false;
  p.name = n;
  PL.list = lib;
  PL.currentName = n;
  writeLibrary(lib);
  renderLibrary();
  updateCurrentLabel();
  return true;
}
function loadLibrary(){
  try {
    const raw = localStorage.getItem(PL.key);
    if (!raw) return [];
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : [];
  } catch (e) { return []; }
}
function writeLibrary(lib){
  try { localStorage.setItem(PL.key, JSON.stringify(lib)); } catch (e) { toast('project library storage failed', true); }
}
function projectNotesCount(p){
  if (Array.isArray(p.activeNotes)) return p.activeNotes.length;
  let c = 0;
  if (Array.isArray(p.pattern)) for (let i = 0; i < p.pattern.length; i++) if (p.pattern[i] >= 0) c++;

}
function projectLengthSec(p){

}
function renderLibrary(){

}
function updateCurrentLabel(){
  const lbl = $('plCurrentLbl'), nm = $('plCurrentName');

function newProject(name, switchNow){
  const id = uid();
  const lib = loadLibrary();
  const p = {
    id: id, name: sanitizeName(name), updated: Date.now(),
    bpm: 150, steps: 32, gate: 0.85, duty: 0.5, pin: 4, loop: true,

function duplicateProject(id){
  const src = ((loadLibrary().find(p => p.id === id)));
  if (!src) { toast('project not found', true); return; }
  const id2 = uid();
  const lib = loadLibrary();
  const dup = Object.assign({}, src, {
    id: id2,
    name: src.name ? (src.name + ' (copy)') : nowLabel(),
    updated: Date.now(),
    pattern: Array.isArray(src.pattern) ? src.pattern.slice() : [],
    activeNotes: Array.isArray(src.activeNotes) ? src.activeNotes.map(n => Object.assign({}, n, { id: undefined })) : []
  });
  // reassign note ids to avoid collisions with live state
  let nid = 1;
  for (const n of (dup.activeNotes || [])) n.id = nid++;
  lib.unshift(dup);
  writeLibrary(lib);
  PL.list = lib;
  openProjectById(id2, true);
  toast('duplicated');
}
function deleteProject(id){
  if (id == null) return;
  if (!confirm('Delete &ldquo;' + ((PL.list.find(p => p.id === id) || {}).name || 'this project') + '&rdquo;?')) return;
  let cur = PL.currentId;
  const lib = loadLibrary().filter(p => p.id !== id);
  writeLibrary(lib);
  PL.list = lib;
  if (PL.currentId === id) {
    cur = (lib.length > 0) ? lib[0].id : null;
    openProjectById(cur, cur == null ? false : true);
  }
  renderLibrary();
  updateCurrentLabel();
  if (cur == null) { stop(); toast('no projects left'); }
}
function openProjectById(id, switchNow){
  if (id == null) {
    stop(true);
    PL.currentId = null;
    PL.currentName = '';
    updateCurrentLabel();
    markDirty();
    renderLibrary();
    return;
  }
  const lib = loadLibrary();
  const p = lib.find(x => x.id === id);

  PL.currentName = p.name || '';
  applyState({
    bpm: p.bpm, steps: p.steps, gate: p.gate, duty: p.duty, pin: p.pin, loop: (p.loop != null ? !!p.loop : true),
    pattern: Array.isArray(p.pattern) ? p.pattern : null,
    activeNotes: Array.isArray(p.activeNotes) ? p.activeNotes : null,
    silent: false
  });
  cursorStep = Math.min(cursorStep, Math.max(0, S.steps - 1));
  selectedNote = null;
  updateNotePanel();
  renderNoteList();
  stop(true);
  updateCurrentLabel();

}
function switchToProject(id){
  if (id == null) {
    if (PL.currentId != null) {
      if (!confirm('Switch away without saving &ldquo;' + ((PL.list.find(p => p.id === PL.currentId) || {}).name || 'current') + '&rdquo;?')) return;
    }
    openProjectById(id, true);
    return;
  }
  if (id === PL.currentId) { closeLibrary(); return; }
  openProjectById(id, true);
}
function importProjectFromFile(file, nameHint){
  const r = new FileReader();
  r.onload = () => {
    const txt = String(r.result || '');
    if (!txt.trim()) { toast('import file empty', true); return; }
    let proj = null;
    try {
      if (txt.trim()[0] === '{' || /\.json$/i.test(file.name || '')) {
        let o = null;
        try { o = JSON.parse(txt); } catch (jsonErr) { throw new Error('invalid json'); }
        if (!o || typeof o !== 'object' || (!Array.isArray(o.pattern) && !Array.isArray(o.activeNotes) && o.format !== 'beep1')) throw new Error('not a beep1 project');
        proj = {
          bpm: +o.bpm, steps: +o.steps, gate: +o.gate, duty: +o.duty, pin: +o.pin, loop: !!o.loop,
          pattern: Array.isArray(o.pattern) ? o.pattern : null,
          activeNotes: Array.isArray(o.activeNotes) ? o.activeNotes : null,
          name: sanitizeName(o.name || nameHint || file.name.replace(/\.[^.]+$/, ''))
        };
      } else {
        // .ino import -> parse into a project (note table or legacy SONG[])
        const parsed = parseIno(txt);
        proj = {
          bpm: parsed.bpm,
          steps: parsed.steps,
          gate: parsed.gate,
          duty: parsed.duty,
          pin: parsed.pin,
          loop: true,
          pattern: parsed.pattern || null,
          activeNotes: parsed.activeNotes || null,
          name: sanitizeName(nameHint || file.name.replace(/\.[^.]+$/, ''))
        };
      }
    } catch (err) {
      toast('import failed — ' + (err && err.message ? err.message : 'bad file'), true);
      return;
    }
    if (!proj) return;
    // create a new project in the library
    newProject(proj.name, false);
    // now open that new project and apply imported contents
    const lib = loadLibrary();
    const created = lib[0];
    if (!created) return;
    openProjectById(created.id, true);
    applyState({
      bpm: proj.bpm, steps: proj.steps, gate: proj.gate, duty: proj.duty, pin: proj.pin, loop: proj.loop,
      pattern: proj.pattern,
      activeNotes: proj.activeNotes,
      silent: false
    });
    cursorStep = 0;
    selectedNote = null;
    updateNotePanel();
    renderNoteList();
    stop(true);
    updateCurrentLabel();
    renderLibrary();
    refreshAudio();
    markDirty();          // persist the freshly imported project
    toast('imported as new project');
  };
  r.onerror = () => toast('import failed', true);
  r.readAsText(file);
}
function exportCurrentProject(){
  const p = snapProject();
  if (p.id == null) { toast('no project to export', true); return; }
  const out = {
    format: 'beep1', version: 4,
    name: p.name,
    bpm: p.bpm, steps: p.steps, gate: p.gate, duty: p.duty, pin: p.pin, loop: p.loop,
    pattern: Array.isArray(p.pattern) ? p.pattern : [],
    activeNotes: Array.isArray(p.activeNotes) ? p.activeNotes : undefined,
    exported: Date.now()
  };
  saveBlob(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }), (p.name || 'beep1_project').replace(/[^A-Za-z0-9 _-]/g, '_') + '.json');
  toast('project exported');
}
function openImportPickerAsNew(){
  const inp = $('plImportFile');
  if (!inp) return;

/* ============ DOM ============ */
const $ = id => document.getElementById(id);
const gc = $('grid'), lc = $('labels'), sc = $('scroller');
const g = gc.getContext('2d'), L = lc.getContext('2d');
const statusEl = $('status'), posLcd = $('posLcd').firstElementChild, lenLcd = $('lenLcd').firstElementChild;

/* ============ HELPERS ============ */
const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);
const noteName = m => NM[m % 12] + (Math.floor(m / 12) - 1);
const noteFreq = n => (n && n.freq > 0) ? n.freq : midiFreq(n.midi);
const stepSec  = () => 60 / S.bpm / 4;
const clampM   = m => Math.max(LOW, Math.min(HIGH, m));
const clamp    = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const pad2     = n => String(n).padStart(2, '0');

function toast(msg, err){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = 'toast', 1900);
}

/* ============ NOTE HELPERS ============ */
function patToActiveNotes(p){
  const notes = []; let i = 0;
  while (i < S.steps){
    if (p[i] >= 0){
      const m = clampM(p[i]);
      let j = i;
      // merge only runs of the SAME pitch into one held note
      while (j < S.steps && p[j] >= 0 && clampM(p[j]) === m) j++;
      notes.push({ id: nextNoteId++, step: i, len: Math.max(1, j - i), midi: m, vol: 1, freq: 0, color: nextPaletteColor() });
      i = j;
    } else i++;
  }
  return notes;
}

/* ============ RENDER AUDIO ============ */
function renderAudio(sampleRate, vol){
  if (vol === undefined) vol = S.vol;
  const ss   = stepSec();
  const total = ss * S.steps;
  const len  = Math.max(8, Math.ceil(total * sampleRate));
  const out  = new Float32Array(len);

  // note-list rendering: held notes (len) + chords arpeggiated like the firmware does
  {
    const ARP = ARP_SEC;   // arpeggio swap rate (s) — matches ARP_MS in the exported .ino
    let ph = 0, curId = -1;
    for (let i = 0; i < len; i++){
      const t = i / sampleRate;
      // notes sounding at t (gate applies to the whole note, not per step)
      let cnt = 0;
      const gEnd = S.gate;
      for (const nn of activeNotes){
        const start = nn.step * ss;
        if (t >= start && t < start + nn.len * ss * gEnd) cnt++;
      }
      let n = null;
      if (cnt){
        const k = cnt > 1 ? Math.floor(t / ARP) % cnt : 0;
        let j = 0;
        for (const nn of activeNotes){
          const start = nn.step * ss;
          if (t >= start && t < start + nn.len * ss * gEnd){
            if (j === k){ n = nn; break; }
            j++;
          }
        }
      }
      let v = 0;
      if (n){
        if (n.id !== curId){ ph = 0; curId = n.id; }
        const f = noteFreq(n);
        ph += f / sampleRate;
        if (ph >= 1) ph -= Math.floor(ph);
        v = (ph < S.duty) ? 1 : -1;
        out[i] = v * 0.45 * vol * (n.vol == null ? 1 : n.vol);
      } else {
        curId = -1;
        out[i] = 0;
      }
    }
    return out;
  }

}

/* ============ AUDIO PLAYBACK ============ */
let ac = null, src = null, buf = null, tStart = 0, tOffset = 0, master = null;

function ensureCtx(){
  if (!ac){
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = S.vol;
    master.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}

function blip(note, dur){
  dur = dur || .11;
  try{
    ensureCtx();
    const sr = ac.sampleRate, n = Math.max(8, Math.floor(dur * sr));
    const b = ac.createBuffer(1, n, sr), d = b.getChannelData(0);
    const f = noteFreq(note); let ph = 0;
    for (let i = 0; i < n; i++){
      ph += f / sr; if (ph >= 1) ph -= 1;
      const atk = Math.min(1, i / (sr * .004));
      const rel = i > n - sr * .012 ? Math.max(0, 1 - (i - (n - sr * .012)) / (sr * .012)) : 1;
      d[i] = ((ph < S.duty) ? 1 : -1) * .35 * S.vol * atk * rel;
    }
    const s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start();
  }catch(e){}
}

function play(){
  stop(true);
  ensureCtx();
  if (master) master.gain.value = S.vol;
  const data = renderAudio(ac.sampleRate, 1);
  buf = ac.createBuffer(1, data.length, ac.sampleRate);
  buf.copyToChannel(data, 0);
  src = ac.createBufferSource();
  src.buffer = buf;
  src.loop = S.loop;
  tOffset = cursorStep * stepSec();
  if (src.loop){ src.loopStart = 0; src.loopEnd = buf.duration; }
  src.connect(master || ac.destination);
  tStart = ac.currentTime + .03;
  src.start(tStart, tOffset);
  src.onended = () => { if (playing && !S.loop){ playing = false; playStep = -1; syncTransport(); } };
  playing = true;
  syncTransport();
}
function stop(keepCursor){
  if (src){ try{ src.onended = null; src.stop(); }catch(e){} src.disconnect(); src = null; }
  playing = false; playStep = -1;
  if (!keepCursor) cursorStep = 0;
  syncTransport();
  drawGrid();
}
function togglePlay(){
  if (playing){ if (playStep >= 0) cursorStep = playStep; stop(true); }
  else play();
}
function syncTransport(){
  $('playBtn').innerHTML = playing ? '&#10074;&#10074; PAUSE' : '&#9654; PLAY';
  $('playBtn').classList.toggle('on', playing);
}

/* ============ PLAYHEAD LOOP ============ */
function tick(){
  if (playing && ac && buf){
    let el = ac.currentTime - tStart + tOffset;
    if (el < 0) el = 0;
    const d = buf.duration;
    if (S.loop){ if (el >= d) el = (el - d) % d; }
    else if (el > d) el = d;
    const s = Math.min(S.steps - 1, Math.max(0, Math.floor(el / stepSec())));
    if (s !== playStep){
      playStep = s;
      const x = s * cellW, sl = sc.scrollLeft, sw = sc.clientWidth;
      if (x < sl + 10 || x > sl + sw - 40) sc.scrollLeft = Math.max(0, x - sw * .35);
    }
  }
  drawGrid();
  updateLcd();
  requestAnimationFrame(tick);
}
function updateLcd(){
  posLcd.textContent = pad2((playing ? playStep : cursorStep) + 1) + '/' + S.steps;
  $('posLcd').classList.toggle('red', playing);
}

/* ============ DRAW ============ */
function layout(){
  const avail = sc.clientWidth || 600;
  cellW = Math.max(11, Math.min(40, Math.floor((avail - 2) / S.steps)));
  const H = RULERH + ROWS * ROWH;
  lc.style.height = H + 'px'; lc.style.width = LABELW + 'px';
  gc.style.height = H + 'px'; gc.style.width = (cellW * S.steps) + 'px';
  drawLabels();
}
function sized(cv, ctx2, w, h){
  const dpr = window.devicePixelRatio || 1;
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
  ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawLabels(){
  const H = RULERH + ROWS * ROWH;
  sized(lc, L, LABELW, H);
  L.clearRect(0, 0, LABELW, H);
  L.fillStyle = '#fff'; L.fillRect(0, 0, LABELW, RULERH);
  L.fillStyle = '#111'; L.fillRect(0, RULERH - 2, LABELW, 2);
  L.font = '700 9px "Space Mono",monospace'; L.textAlign = 'left'; L.textBaseline = 'middle';
  L.fillText('NOTE', 6, RULERH / 2);
  for (let r = 0; r < ROWS; r++){
    const m = HIGH - r, y = RULERH + r * ROWH;
    const nm = NM[m % 12], oct = Math.floor(m / 12) - 1, black = nm.indexOf('#') > -1;
    L.fillStyle = black ? '#ececea' : '#fff';
    L.fillRect(0, y, LABELW, ROWH);
    L.fillStyle = '#e4e2dc'; L.fillRect(0, y + ROWH - 1, LABELW, 1);
    if (m % 12 === 0){ L.fillStyle = '#111'; L.fillRect(0, y - 1, LABELW, 1); }
    L.fillStyle = black ? '#111' : '#fff';
    L.fillRect(LABELW - 12, y + 2, 10, ROWH - 5);
    L.fillStyle = black ? '#fff' : '#111';
    L.fillRect(LABELW - 12, y + 2, black ? 5 : 10, ROWH - 5);
    L.fillStyle = black ? '#94918a' : '#111';
    L.font = (m % 12 === 0 ? '700 ' : '') + '9px "Space Mono",monospace';
    L.fillText(nm + (m % 12 === 0 ? oct : ''), 6, y + ROWH / 2 + .5);
  }
}
function drawGrid(){
  const W = cellW * S.steps, H = RULERH + ROWS * ROWH;
  sized(gc, g, W, H);
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);

  /* row bands */
  for (let r = 0; r < ROWS; r++){
    const m = HIGH - r;
    if (NM[m % 12].indexOf('#') > -1){ g.fillStyle = '#f5f5f2'; g.fillRect(0, RULERH + r * ROWH, W, ROWH); }
  }
  /* horizontal lines */
  for (let r = 1; r <= ROWS; r++){
    const m = HIGH - r + 1;
    g.fillStyle = (m % 12 === 0) ? '#c9c7c1' : '#e8e7e2';
    g.fillRect(0, RULERH + r * ROWH - 1, W, 1);
  }
  /* vertical step lines */
  for (let s = 1; s < S.steps; s++){
    g.fillStyle = (s % 16 === 0) ? '#a5a39c' : (s % 4 === 0) ? '#cfcdd6'.replace('d6','c7') : '#eceae5';
    g.fillRect(s * cellW, RULERH, 1, H - RULERH);
  }

  /* notes (same model in both modes: bars with length, chords stack on one step) */
  const hovNote = (hover && !playing) ? noteAtCell(hover.s, hover.m) : null;
  for (const n of activeNotes){
    const r = HIGH - n.midi;
    if (r < 0 || r >= ROWS) continue;
    const x = n.step * cellW;
    const y = RULERH + r * ROWH;
    const w = n.len * cellW;
    const h = ROWH - 2;
    const vol = (n.vol == null ? 1 : n.vol);
    const isSel = (selectedNote === n.id);
    const isHov = (hovNote && hovNote.id === n.id);
    g.globalAlpha = 0.35 + 0.65 * vol;
    g.fillStyle = noteColor(n.color);
    g.fillRect(x + 1, y + 1, Math.max(2, w - 2), h);
    g.globalAlpha = 1;
    // thin edge so neighbouring notes stay readable
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1;
    g.strokeRect(x + 1.5, y + 1.5, Math.max(1, w - 3), h - 1);
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.fillRect(x + 2, y + 2, Math.max(1, w - 8), 1);
    // volume strip on right edge
    const vh = Math.round(h * vol);
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.fillRect(x + w - 4, y + 1 + (h - vh), 2, vh);
    if (isSel || isHov){
      g.strokeStyle = isSel ? '#111' : '#e23d28'; g.lineWidth = isSel ? 2 : 1;
      g.strokeRect(x + 0.5, y + 0.5, w - 1, h + 1);
      // resize grips on both ends (notes are one row tall, so these read as corners)
      g.fillStyle = '#e23d28';
      g.fillRect(x, y + 2, 3, h - 4);
      g.fillRect(x + w - 3, y + 2, 3, h - 4);
      // corner arrow cue on the right grip
      if (w >= cellW * 0.9){
        g.fillRect(x + w - 5, y + h - 4, 2, 2);
      }
    }
  }

  /* playhead */
  if (playStep >= 0 && playStep < S.steps){
    g.fillStyle = 'rgba(226,61,40,.13)';
    g.fillRect(playStep * cellW, RULERH, cellW, H - RULERH);
    g.fillStyle = '#e23d28';
    g.fillRect(playStep * cellW, 0, 2, H);
  }
  /* cursor */
  if (!playing){
    g.fillStyle = '#e23d28';
    const x = cursorStep * cellW;
    g.beginPath(); g.moveTo(x, RULERH - 8); g.lineTo(x + 7, RULERH - 1); g.lineTo(x, RULERH - 1); g.closePath(); g.fill();
  }
  /* ruler */
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, RULERH - 2);
  g.fillStyle = '#111'; g.fillRect(0, RULERH - 2, W, 2);
  g.font = '9px "Space Mono",monospace'; g.textBaseline = 'middle'; g.textAlign = 'left';
  for (let s = 0; s < S.steps; s++){
    const x = s * cellW;
    if (s % 4 !== 0){
      if (cellW >= 16){ g.fillStyle = '#dcdad4'; g.fillRect(x + Math.floor(cellW / 2), RULERH - 8, 1, 6); }
      continue;
    }
    const cur = (playing ? playStep : -1) === s;
    if (cur){ g.fillStyle = '#e23d28'; g.fillRect(x + 1, 0, cellW - 1, RULERH - 2); }
    else if (s === cursorStep){ g.fillStyle = '#f0f0ec'; g.fillRect(x + 1, 0, cellW - 1, RULERH - 2); }
    g.fillStyle = cur ? '#fff' : (s % 16 === 0 ? '#111' : '#8d8b85');
    if (cellW >= 22 || s % 16 === 0) g.fillText(String(s / 4 + 1), x + 4, RULERH / 2 - 1);
    g.fillStyle = cur ? '#fff' : '#111';
    g.fillRect(x, RULERH - 9, 1, 7);
  }
  /* hover: outline the note under the cursor, or the empty cell while painting */
  if (hover && !playing){
    const r = HIGH - hover.m;
    if (r >= 0 && r < ROWS){
      g.strokeStyle = '#e23d28'; g.lineWidth = 1;
      if (hovNote){
        g.strokeRect(hovNote.step * cellW + 1.5, RULERH + r * ROWH + 1.5,
                     Math.max(cellW - 3, hovNote.len * cellW - 3), ROWH - 3);
      } else {
        g.strokeRect(hover.s * cellW + 1.5, RULERH + r * ROWH + 1.5, cellW - 3, ROWH - 3);
      }
    }
  }
  g.strokeStyle = '#111'; g.lineWidth = 2;
  g.strokeRect(1, RULERH + 1, W - 2, H - RULERH - 2);
}

/* ============ STATUS ============ */
function updateStatus(){
  const count = activeNotes.length;
  const len = (S.steps * stepSec());
  lenLcd.textContent = len.toFixed(2) + 's';
  $('stepsOut').textContent = stepsLabel();
  let left = 'NOTES <b>' + count + '</b>' +
             ' &nbsp;&middot;&nbsp; <b>' + len.toFixed(2) + 's</b>' +
             ' &nbsp;&middot;&nbsp; DUTY <b>' + Math.round(S.duty * 100) + '%</b>';
  if (hover){
    const hn = noteAtCell(hover.s, hover.m);
    const hf = hn ? noteFreq(hn) : midiFreq(hover.m);
    const voices = activeNotes.filter(n => hover.s >= n.step && hover.s < n.step + n.len).length;
    left = '<b>' + noteName(hn ? hn.midi : hover.m) + '</b> &nbsp;' + hf.toFixed(1) + ' Hz' +
           (hn && hn.freq > 0 ? ' <b>~</b>' : '') +
           ' &nbsp;&middot;&nbsp; STEP <b>' + pad2(hover.s + 1) + '</b>' +
           (hn ? ' &nbsp;&middot;&nbsp; <b>' + hn.len + ' st</b> @ ' + Math.round((hn.vol == null ? 1 : hn.vol) * 100) + '%' : ' &nbsp;&middot;&nbsp; REST') +
           (voices > 1 ? ' &nbsp;&middot;&nbsp; <b>CHORD ' + voices + '</b>' : '');
  }
  statusEl.innerHTML = left;
}

/* ============ HIT TESTING ============ */
function canvasCoords(ev){
  const rect = gc.getBoundingClientRect();
  const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
  const py = (ev.touches ? ev.touches[0].clientY : ev.clientY) - rect.top;
  return { px, py };
}
function cellFrom(ev){
  const { px, py } = canvasCoords(ev);
  const s = Math.floor(px / cellW);
  const r = Math.floor((py - RULERH) / ROWH);
  if (s < 0 || s >= S.steps || py < RULERH || r < 0 || r >= ROWS) return null;
  return { s: s, m: clampM(HIGH - r), px, py };
}
function rulerFrom(ev){
  const { px } = canvasCoords(ev);
  const s = Math.floor(px / cellW);
  return (s >= 0 && s < S.steps) ? s : null;
}
/* note occupying the given step/pitch cell (topmost = last added wins) */
function noteAtCell(s, m){
  for (let i = activeNotes.length - 1; i >= 0; i--){
    const n = activeNotes[i];
    if (n.midi !== m) continue;
    if (s >= n.step && s < n.step + n.len) return n;
  }
  return null;
}
/* grip zone at each end scales down for short notes so a body always remains */
function gripW(n){
  const w = n.len * cellW;
  return Math.max(2, Math.min(6, Math.floor(w / 3)));
}
/* every note of the given pitch covering the cell, topmost first */
function notesAtCell(s, m){
  const out = [];
  for (let i = activeNotes.length - 1; i >= 0; i--){
    const n = activeNotes[i];
    if (n.midi === m && s >= n.step && s < n.step + n.len) out.push(n);
  }
  return out;
}
function noteAt(px, py){
  if (py < RULERH) return null;
  const row = Math.floor((py - RULERH) / ROWH);
  const midi = clampM(HIGH - row);
  const s = Math.floor(px / cellW);
  const stack = notesAtCell(s, midi);
  if (!stack.length) return null;
  let n = stack[0];
  const gw = gripW(n);
  const l0 = n.step * cellW, r0 = l0 + n.len * cellW;
  let onEnd = (px >= r0 - gw) || (px <= l0 + gw);
  // clicking the body of stacked same-pitch notes cycles through them
  if (!onEnd && stack.length > 1){
    const idx = stack.findIndex(x => x.id === selectedNote);
    if (idx >= 0) n = stack[(idx + 1) % stack.length];
  }
  const left = n.step * cellW, right = left + n.len * cellW;
  let handle = 'body';
  if (px >= right - gw) handle = 'resizeR';
  else if (px <= left + gw) handle = 'resizeL';
  return { note: n, handle: handle };
}
/* can a new note be painted at this cell without colliding? */
function paintFree(s, m){
  return !activeNotes.some(n => n.midi === m && s >= n.step && s < n.step + n.len);
}

/* ============ INPUT ============ */
gc.addEventListener('contextmenu', e => e.preventDefault());

gc.addEventListener('mousedown', e => {
  e.preventDefault();
  const { px, py } = canvasCoords(e);
  if (py < RULERH){
    const s = rulerFrom(e);
    if (s !== null){ cursorStep = s; if (playing) play(); drawGrid(); }
    return;
  }
  const c = cellFrom(e);
  if (!c) return;

  const hit = noteAt(px, py);
  if (e.button === 2){
    // right-click erases the note under the cursor (both modes)
    if (hit){
      activeNotes = activeNotes.filter(n => n.id !== hit.note.id);
      if (selectedNote === hit.note.id) selectedNote = null;
      updateNotePanel(); updateStatus(); drawGrid(); edit();
    }
    return;
  }
  if (hit){
    selectedNote = hit.note.id;
    const n = hit.note;
    dragState = { type: hit.handle, noteId: n.id, startStep: n.step, startLen: n.len,
      startMidi: n.midi, startVol: (n.vol == null ? 1 : n.vol), origX: px, origY: py };
    updateNotePanel(); updateStatus(); drawGrid();
    return;
  }
  // empty cell: paint a stroke of notes (drag to lay a run)
  const note = { id: nextNoteId++, step: c.s, len: 1, midi: c.m, vol: 1, freq: 0, color: nextPaletteColor() };
  activeNotes.push(note);
  selectedNote = note.id;
  if (!playing) blip(note, .09);
  dragState = { type: 'paint' };
  updateNotePanel(); updateStatus(); drawGrid();
});

window.addEventListener('mousemove', e => {
  const c = cellFrom(e);
  const { px, py } = canvasCoords(e);
  if (dragState){
    if (dragState.type === 'paint'){
      if (c) paintAt(c);
      else if (hover){ hover = null; updateStatus(); drawGrid(); }
      return;
    }
    applyDrag(px, py, e.shiftKey);
    return;
  }
  if (!c){ if (hover){ hover = null; updateStatus(); drawGrid(); } return; }
  if (!hover || hover.s !== c.s || hover.m !== c.m){ hover = c; updateStatus(); drawGrid(); }
});

window.addEventListener('mouseup', () => {
  if (dragState){
    dragState = null;
    edit();
  }
});
gc.addEventListener('mouseleave', () => { hover = null; updateStatus(); drawGrid(); });

gc.addEventListener('touchstart', e => {
  e.preventDefault();
  const c = cellFrom(e); if (!c) return;
  const { px, py } = canvasCoords(e);
  const hit = noteAt(px, py);
  if (hit){
    selectedNote = hit.note.id;
    dragState = { type: hit.handle, noteId: hit.note.id, startStep: hit.note.step, startLen: hit.note.len,
      startMidi: hit.note.midi, startVol: (hit.note.vol == null ? 1 : hit.note.vol), origX: px, origY: py };
  } else {
    const note = { id: nextNoteId++, step: c.s, len: 1, midi: c.m, vol: 1, freq: 0, color: nextPaletteColor() };
    activeNotes.push(note);
    selectedNote = note.id;
    if (!playing) blip(note, .09);
    dragState = { type: 'paint' };
  }
  updateNotePanel(); updateStatus(); drawGrid();
}, { passive:false });
gc.addEventListener('touchmove', e => {
  e.preventDefault();
  const c = cellFrom(e); if (!c) return;
  if (!dragState) return;
  if (dragState.type === 'paint'){ paintAt(c); return; }
  const { px, py } = canvasCoords(e);
  applyDrag(px, py, false);
}, { passive:false });
gc.addEventListener('touchend', () => {
  if (dragState){ dragState = null; edit(); }
});

/* ============ SHARED DRAG / PAINT ============ */
function applyDrag(px, py, shiftKey){
  if (!dragState || dragState.type === 'paint') return false;
  const n = activeNotes.find(x => x.id === dragState.noteId);
  if (!n) return false;
  const dxSteps = (px - dragState.origX) / cellW;
  const dy = Math.round((py - dragState.origY) / ROWH);
  if (shiftKey && dragState.type === 'body'){
    n.vol = clamp(dragState.startVol + (dragState.origY - py) / 80, 0, 1);
  } else if (dragState.type === 'body'){
    const newStep = Math.round(dragState.startStep + dxSteps);
    n.step = clamp(newStep, 0, Math.max(0, S.steps - Math.ceil(n.len)));
    n.midi = clampM(dragState.startMidi - dy);
  } else if (dragState.type === 'resizeR'){
    const right = Math.round(n.step + Math.max(1, dragState.startLen + dxSteps));
    n.len = clamp(right - n.step, 1, S.steps - n.step);
  } else if (dragState.type === 'resizeL'){
    // resize from the left corner: keep right edge fixed (snapped to whole steps)
    const rightEdge = Math.round(dragState.startStep + dragState.startLen);
    const newLeft = clamp(Math.round(dragState.startStep + dxSteps), 0, rightEdge - 1);
    n.step = newLeft;
    n.len = rightEdge - newLeft;
  }
  syncNoteList(); updateStatus(); drawGrid();
  return true;
}
function paintAt(c){
  if (!c) return;
  hover = c;
  if (paintFree(c.s, c.m)){
    const note = { id: nextNoteId++, step: c.s, len: 1, midi: c.m, vol: 1, freq: 0, color: nextPaletteColor() };
    activeNotes.push(note);
    selectedNote = note.id;
    if (!playing) blip(note, .09);
    renderNoteList(); updateStatus(); drawGrid(); buildCode();
    if (playing) liveRestart();
  } else {
    updateStatus(); drawGrid();
  }
}

/* ============ CONTROLS ============ */
function bind(id, fn){ $(id).addEventListener('input', fn); $(id).addEventListener('change', fn); }
function stepsLabel(){ return (S.steps % 16 === 0) ? (S.steps / 16) + ' BARS' : S.steps + ' STEPS'; }
function syncStepsUI(){
  const sel = $('steps'), sl = $('stepsR');
  if (sl && sl.value !== String(S.steps)) sl.value = S.steps;
  if (sel){
    let found = false;
    for (let i = 0; i < sel.options.length; i++) if (+sel.options[i].value === S.steps){ sel.selectedIndex = i; found = true; break; }
    if (!found) sel.selectedIndex = -1;
  }
  $('stepsOut').textContent = stepsLabel();
}
function setSteps(n){
  S.steps = Math.max(1, Math.min(MAXSTEPS, Math.round(n) || 16));
  cursorStep = Math.min(cursorStep, S.steps - 1);
  // clamp active notes into range
  for (const nt of activeNotes){
    if (nt.step >= S.steps){ nt.step = Math.max(0, S.steps - nt.len); }
    if (nt.step + nt.len > S.steps) nt.len = Math.max(1, S.steps - nt.step);
  }
  syncStepsUI(); layout(); refreshAudio();
}
bind('bpm', () => { S.bpm = +$('bpm').value; $('bpmOut').textContent = S.bpm + ' BPM'; refreshAudio(); });
bind('steps', () => { setSteps(+$('steps').value); });
bind('stepsR', () => { setSteps(+$('stepsR').value); });
bind('gate', () => { S.gate = (+$('gate').value) / 100; $('gateOut').textContent = $('gate').value + ' %'; refreshAudio(); });
bind('duty', () => { S.duty = +$('duty').value; refreshAudio(); });
bind('vol', () => {
  S.vol = (+$('vol').value) / 100; $('volOut').textContent = $('vol').value;
  if (master && ac){ try{ master.gain.setTargetAtTime(S.vol, ac.currentTime, .02); }catch(e){ master.gain.value = S.vol; } }
  updateStatus(); drawGrid();
});
bind('pin', () => { S.pin = Math.max(1, Math.min(48, +$('pin').value || 4)); buildCode(); });
$('loopChk').addEventListener('change', () => { S.loop = $('loopChk').checked; reseekRestart(); });

/* ============ NOTE RAIL (side panel) ============ */
function renderNoteList(){ updateNotePanel(); }
function syncNoteList(){ updateNotePanel(); }
function openNoteRail(){ $('noteRail').hidden = false; layout(); drawGrid(); }
function closeNoteRail(){ $('noteRail').hidden = true; layout(); drawGrid(); }
$('noteRailBtn').onclick = () => { if ($('noteRail').hidden) openNoteRail(); else closeNoteRail(); };
$('noteRailClose').onclick = closeNoteRail;

/* ============ SIMPLE / ADVANCED MODE ============ */
let simpleMode = true;
try { if (localStorage.getItem('beep1.simple') === '0') simpleMode = false; } catch (e) {}
function applyUiMode(){
  document.body.classList.toggle('simple', simpleMode);
  const b = $('uiBtn');
  if (b) b.innerHTML = simpleMode ? '&#9881; ADVANCED' : '&#9786; SIMPLE';
  layout(); drawGrid(); updateNotePanel();
}
$('uiBtn').onclick = () => {
  simpleMode = !simpleMode;
  try { localStorage.setItem('beep1.simple', simpleMode ? '1' : '0'); } catch (e) {}
  applyUiMode();
};

let dirtyT = null;
function reseekRestart(){
  if (!playing) { updateStatus(); drawGrid(); buildCode(); return; }
  const s = playStep >= 0 ? playStep : cursorStep;
  cursorStep = ((s % S.steps) + S.steps) % S.steps;
  updateStatus(); drawGrid(); buildCode();
  play();
}
function liveRestart(){ clearTimeout(dirtyT); dirtyT = setTimeout(reseekRestart, 180); }
function refreshAudio(){
  updateStatus(); drawGrid(); buildCode(); renderNoteList();
  if (playing) liveRestart();
}
function edit(){ refreshAudio(); markDirty(); }

$('playBtn').onclick = () => { togglePlay(); };
$('stopBtn').onclick = () => stop();
$('clearBtn').onclick = () => {
  activeNotes = []; selectedNote = null; updateNotePanel();
  edit(); toast('pattern cleared');
};
$('rotL').onclick = () => { rotate(1); edit(); };
$('rotR').onclick = () => { rotate(-1); edit(); };
$('octD').onclick = () => { transpose(-12); edit(); };
$('octU').onclick = () => { transpose(12); edit(); };
$('demoBtn').onclick = () => { loadDemo(); edit(); toast('demo loaded'); };
$('randBtn').onclick = () => { randomize(); edit(); toast('random riff'); };

function rotate(d){
  for (const n of activeNotes){
    let s = ((n.step + d) % S.steps + S.steps) % S.steps;
    if (s + n.len > S.steps) s = Math.max(0, S.steps - Math.ceil(n.len));
    n.step = s;
  }
}
function transpose(d){
  for (const n of activeNotes) n.midi = clampM(n.midi + d);
}
function loadDemo(){
  activeNotes = [];
  S.steps = 32; $('steps').value = '32'; S.bpm = 150; $('bpm').value = 150; $('bpmOut').textContent = '150 BPM';
  const d = [[0,72],[2,67],[4,75],[6,72],[8,70],[10,67],[12,72],[14,74],
             [16,75],[18,79],[20,77],[22,75],[24,74],[26,72],[28,67],[30,72]];
  for (const p of d){
    activeNotes.push({ id: nextNoteId++, step: p[0], len: 1, midi: p[1], vol: 1, freq: 0, color: nextPaletteColor() });
  }
  cursorStep = 0; syncStepsUI(); layout();
}
function randomize(){
  activeNotes = [];
  const sc5 = [0, 3, 5, 7, 10];
  let deg = 0;
  for (let s = 0; s < S.steps; s++){
    if (s % 2 === 1 && Math.random() < .72) continue;
    if (Math.random() < .16) continue;
    deg += Math.floor(Math.random() * 5) - 2;
    deg = Math.max(-3, Math.min(sc5.length + 2, deg));
    const idx = ((deg % sc5.length) + sc5.length) % sc5.length;
    const oct = Math.floor(deg / sc5.length);
    const midi = clampM(60 + oct * 12 + sc5[idx]);
    // random length 1-3
    const len = 1 + Math.floor(Math.random() * 3);
    // avoid overlap: if previous note extends, skip
    const last = activeNotes[activeNotes.length-1];
    if (last && s < last.step + last.len) continue;
    if (s + len > S.steps) continue;
    activeNotes.push({ id: nextNoteId++, step: s, len: len, midi: midi, vol: 0.6 + Math.random() * 0.4, freq: 0, color: nextPaletteColor() });
  }
}

function applyNoteFreq(src, snap){
  const n = activeNotes.find(x => x.id === selectedNote);

  else n.freq = f;
  if (snap) n.midi = clampM(midiFromFreq(noteFreq(n)));
  const rf = Math.round(noteFreq(n));

  updateStatus(); drawGrid();
}

window.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT') return;
  if (e.code === 'Space' && tag === 'BUTTON') return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if (e.key === 'l' || e.key === 'L'){ const c = $('loopChk'); c.checked = !c.checked; c.dispatchEvent(new Event('change')); }
  else if (e.key === 'ArrowRight'){ cursorStep = Math.min(S.steps - 1, cursorStep + 1); drawGrid(); }
  else if (e.key === 'ArrowLeft'){ cursorStep = Math.max(0, cursorStep - 1); drawGrid(); }
  else if (e.key === 'Delete' || e.key === 'Backspace'){
    e.preventDefault();
    if (selectedNote != null){
      activeNotes = activeNotes.filter(n => n.id !== selectedNote);
      selectedNote = null; updateNotePanel();
    } else {
      activeNotes = [];
    }
    edit();
  }
});

function saveBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
}
function wavBlob(f32, sr){
  const n = f32.length, ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
  const put = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  put(0,'RIFF'); v.setUint32(4, 36 + n * 2, true); put(8,'WAVE'); put(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  put(36,'data'); v.setUint32(40, n*2, true);
  for (let i = 0; i < n; i++){
    const x = Math.max(-1, Math.min(1, f32[i]));
    v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return new Blob([ab], { type:'audio/wav' });
}
function mp3Blob(f32, sr){
  if (typeof lamejs === 'undefined' || !lamejs.Mp3Encoder) throw new Error('no-mp3');
  const enc = new lamejs.Mp3Encoder(1, sr, 128);
  const n = f32.length, left = new Int16Array(n);
  for (let i = 0; i < n; i++){ const x = Math.max(-1, Math.min(1, f32[i])); left[i] = x < 0 ? x * 0x8000 : x * 0x7fff; }
  const CH = 1152 * 8, parts = [];
  for (let i = 0; i < n; i += CH){
    const b = enc.encodeBuffer(left.subarray(i, Math.min(n, i + CH)));
    if (b.length > 0) parts.push(new Uint8Array(b));
  }
  const end = enc.flush();
  if (end.length > 0) parts.push(new Uint8Array(end));
  return new Blob(parts, { type:'audio/mp3' });
}
function busy(btn, on, txt){

  else { btn.innerHTML = btn._old || btn.innerHTML; btn.disabled = false; }
}

/* ============ CODE GENERATION ============ */
function makeIno(){
  const stepMs = Math.round(60000 / (S.bpm * 4));
  const gatePct = Math.round(S.gate * 100);
  const dutyPct = Math.round(S.duty * 100);
  const total = (S.steps * stepSec()).toFixed(2);
  const barsTxt = (S.steps % 16 === 0) ? (S.steps / 16) + ' bars' : S.steps + ' steps';
  return makeInoPassive(stepMs, gatePct, dutyPct, total, barsTxt);
}
function makeInoPassive(stepMs, gatePct, dutyPct, total, barsTxt){
  // one row per note — chords are several rows sharing the same start step
  const notes = activeNotes.slice().sort((a, b) => (a.step - b.step) || (a.midi - b.midi));
  if (notes.length === 0) notes.push({ step: 0, len: 1, midi: 60, vol: 0 });  // silent placeholder
  const N = notes.length;
  // biggest chord, for the firmware's arpeggio buffer
  let maxV = 1;
  for (const n of notes){
    let v = 0;
    for (const m of notes) if (m.step < n.step + n.len && m.step + m.len > n.step) v++;
    if (v > maxV) maxV = v;
  }
  let stepBody = '', lenBody = '', fBody = '';
  for (let i = 0; i < N; i += 8){
    const sl = notes.slice(i, i + 8);
    const sStr = sl.map(n => String(Math.round(n.step)).padStart(3, ' ')).join(', ');
    const lStr = sl.map(n => String(Math.max(1, Math.round(n.len))).padStart(3, ' ')).join(', ');
    const fStr = sl.map(n => String(n.vol === 0 ? 0 : Math.min(65535, Math.round(noteFreq(n)))).padStart(5, ' ')).join(', ');
    const nStr = sl.map(n => n.vol === 0 ? '--' : noteName(n.midi)).join(' ');
    const tail = (i + 8 < N) ? ',' : ' ';
    stepBody += '  ' + sStr + tail + '   /* ' + pad2(i) + ': ' + nStr + ' */\n';
    lenBody  += '  ' + lStr + tail + '\n';
    fBody    += '  ' + fStr + tail + '\n';
  }
  return '/* =====================================================================\n' +
'   BEEP//1  --  passive piezo song for ESP32 (held notes + chords)\n' +
'   generated by BEEP//1 studio (PASSIVE mode)\n\n' +
'   tempo     : ' + S.bpm + ' BPM (16th steps = ' + stepMs + ' ms)\n' +
'   steps     : ' + S.steps + '  (' + barsTxt + ')\n' +
'   note gate : ' + gatePct + ' %\n' +
'   duty      : ' + dutyPct + ' % (preview only; tone() is fixed 50 %)\n' +
'   length    : ' + total + ' s\n' +
'   notes     : ' + N + '  (biggest chord = ' + maxV + ' voices)\n' +
'   chords    : voices are time-multiplexed (arpeggio) on the single pin\n' +
'   hardware  : passive buzzer / piezo  ->  BUZZER_PIN  and  GND\n' +
'   ===================================================================== */\n\n' +
'#define BUZZER_PIN   ' + S.pin + '\n' +
'#define TEMPO_BPM    ' + S.bpm + '\n' +
'#define SONG_STEPS   ' + S.steps + '\n' +
'#define GATE_PCT     ' + gatePct + '\n' +
'#define DUTY_PCT     ' + dutyPct + '\n' +
'#define STEP_MS      (60000UL / (TEMPO_BPM * 4UL))\n' +
'#define REPEAT_GAP   500\n' +
'#define NOTE_COUNT   ' + N + '\n' +
'#define MAX_VOICES   ' + maxV + '\n' +
'#define ARP_MS       6      /* ms per chord tone (chords flip at ~166 Hz) */\n\n' +
'/* one row per note: start step, length in steps, frequency in Hz (0 = silence) */\n' +
'const uint16_t N_STEP[NOTE_COUNT] = {\n' + stepBody + '};\n' +
'const uint8_t  N_LEN [NOTE_COUNT] = {\n' + lenBody + '};\n' +
'const uint16_t N_F   [NOTE_COUNT] = {\n' + fBody + '};\n\n' +
'void setup() {\n' +
'  pinMode(BUZZER_PIN, OUTPUT);\n' +
'  digitalWrite(BUZZER_PIN, LOW);\n' +
'}\n\n' +
'void playSong() {\n' +
'  const uint32_t step  = STEP_MS;\n' +
'  const uint32_t total = (uint32_t)SONG_STEPS * step;\n' +
'  uint32_t t = 0;\n' +
'  uint16_t arp = 0;\n' +
'  uint16_t lastF = 0;\n\n' +
'  while (t < total) {\n' +
'    /* voices sounding right now */\n' +
'    uint16_t fs[MAX_VOICES];\n' +
'    uint8_t  nf = 0;\n' +
'    uint32_t nextEv = total;\n' +
'    for (uint16_t i = 0; i < NOTE_COUNT; i++) {\n' +
'      uint32_t on  = (uint32_t)N_STEP[i] * step;\n' +
'      uint32_t off = on + ((uint32_t)N_LEN[i] * step * (uint32_t)GATE_PCT) / 100UL;\n' +
'      if (t >= on && t < off) {\n' +
'        if (N_F[i] > 0 && nf < MAX_VOICES) fs[nf++] = N_F[i];\n' +
'        if (off < nextEv) nextEv = off;\n' +
'      }\n' +
'      if (on > t && on < nextEv) nextEv = on;\n' +
'    }\n\n' +
'    if (nf == 0) {\n' +
'      if (lastF) { noTone(BUZZER_PIN); lastF = 0; }\n' +
'      uint32_t gap = nextEv - t;\n' +
'      if (gap > 10) gap = 10;                 /* poll every 10 ms while silent */\n' +
'      delay(gap); t += gap;\n' +
'      continue;\n' +
'    }\n\n' +
'    if (nf == 1) {\n' +
'      /* one voice: hold it, retrigger only when the pitch changes */\n' +
'      if (fs[0] != lastF) { tone(BUZZER_PIN, fs[0]); lastF = fs[0]; }\n' +
'      uint32_t slice = nextEv - t;\n' +
'      if (slice > 20) slice = 20;\n' +
'      delay(slice); t += slice;\n' +
'    } else {\n' +
'      /* chord: flip through the voices every ARP_MS on the single pin */\n' +
'      uint16_t f = fs[arp % nf]; arp++;\n' +
'      if (f != lastF) { tone(BUZZER_PIN, f); lastF = f; }\n' +
'      delay(ARP_MS); t += ARP_MS;\n' +
'    }\n' +
'  }\n' +
'  noTone(BUZZER_PIN);\n' +
'}\n\n' +
'void loop() {\n' +
'  playSong();\n' +
'  delay(REPEAT_GAP);\n' +
'}\n\n' +
'/* ---- optional: exact duty cycle with LEDC (Arduino-ESP32 core 2.x) ----\n' +
'   const uint8_t  CH   = 0;\n' +
'   const uint16_t RES  = 10;                       // 10-bit duty\n' +
'   const uint16_t DUTY = (uint16_t)(1023 * ' + dutyPct + ' / 100);\n\n' +
'   void beepDuty(uint16_t f, uint32_t ms) {\n' +
'     ledcSetup(CH, f, RES);\n' +
'     ledcAttachPin(BUZZER_PIN, CH);\n' +
'     ledcWrite(CH, DUTY);\n' +
'     delay(ms);\n' +
'     ledcWrite(CH, 0);\n' +
'     ledcDetachPin(BUZZER_PIN);\n' +
'   }\n' +
'   -------------------------------------------------------------------- */\n';
}
function makeJson(){
  // detailed note list (chords = several notes on the same step)
  const notes = [];
  for (const n of activeNotes){
    notes.push({
      step: n.step, len: n.len, midi: n.midi, note: noteName(n.midi),
      freq: +noteFreq(n).toFixed(2),
      timeMs: Math.round(n.step * 60000 / (S.bpm * 4)),
      durMs: Math.round(60000 / (S.bpm * 4) * n.len * S.gate),
      vol: +(n.vol == null ? 1 : n.vol).toFixed(3)
    });
  }
  // per-step pattern kept for compat with older files (last voice wins)
  const pattern = new Array(S.steps).fill(-1);
  for (const n of activeNotes){
    for (let k = 0; k < n.len; k++){
      const s = Math.round(n.step) + k;
      if (s >= 0 && s < S.steps) pattern[s] = n.midi;
    }
  }
  return JSON.stringify({
    format: 'beep1', version: 4,
    bpm: S.bpm, steps: S.steps, stepMs: Math.round(60000 / (S.bpm * 4)),
    gate: S.gate, duty: S.duty, pin: S.pin,
    pattern: pattern,
    activeNotes: activeNotes.map(n => ({ step: n.step, len: n.len, midi: n.midi, vol: n.vol, freq: (n.freq > 0 ? +n.freq.toFixed(3) : 0), color: Math.round(n.color) || 0 })),
    notes: notes
  }, null, 2);
}
function buildCode(){
  const c = makeIno();
  $('codeOut').textContent = c;
  return c;
}
$('dlIno').onclick = () => { saveBlob(new Blob([buildCode()], { type:'text/plain' }), 'beep1_song.ino'); toast('beep1_song.ino downloaded'); };
$('dlJson').onclick = () => { saveBlob(new Blob([makeJson()], { type:'application/json' }), 'beep1_song.json'); toast('pattern json downloaded'); };

$('impFile').addEventListener('change', e => {

function importText(txt, name){
  const t = (txt || '').trim();
  if (!t) throw new Error('empty file');
  if (t[0] === '{' || /\.json$/i.test(name || '')) return importJson(t);
  return importIno(t);
}
function importJson(t){
  const o = JSON.parse(t);
  if (!o || typeof o !== 'object' || (!Array.isArray(o.pattern) && !Array.isArray(o.activeNotes) && o.format !== 'beep1')) throw new Error('not a beep1 file');
  applyState({
    bpm: +o.bpm, steps: +o.steps, gate: +o.gate, duty: +o.duty, pin: +o.pin,
    pattern: Array.isArray(o.pattern) ? o.pattern : null,
    activeNotes: Array.isArray(o.activeNotes) ? o.activeNotes : null
  });
  return true;
}
function midiFromFreq(f){
  if (!(f > 0)) return -1;
  return clampM(Math.round(69 + 12 * Math.log(f / 440) / Math.LN2));
}
function parseIno(t){
  const grabNum = re => { const m = t.match(re); return m ? +m[1] : NaN; };
  const grabArr = nm => {
    const m = t.match(new RegExp('\\b' + nm + '\\s*\\[[^\\]]*\\]\\s*=\\s*\\{([\\s\\S]*?)\\}'));
    if (!m) return null;
    return m[1].replace(/\/\*[\s\S]*?\*\//g, ' ').split(/[^0-9]+/).filter(x => x !== '').map(Number);
  };
  const bpm = grabNum(/#define\s+TEMPO_BPM\s+(\d+)/);
  const gate = grabNum(/#define\s+GATE_PCT\s+(\d+)/);
  const pin = grabNum(/#define\s+BUZZER_PIN\s+(\d+)/);
  const duty = grabNum(/#define\s+DUTY_PCT\s+(\d+)/);

  // ---- new note-table format (held notes + chords, arpeggio playback) ----
  const st = grabArr('N_STEP');
  if (st){
    const ln = grabArr('N_LEN'), fq = grabArr('N_F');
    if (!ln || !fq || ln.length !== st.length || fq.length !== st.length) throw new Error('incomplete note table');
    let steps = grabNum(/#define\s+SONG_STEPS\s+(\d+)/);
    if (!isFinite(steps) || steps <= 0){
      steps = 1;
      for (let i = 0; i < st.length; i++) steps = Math.max(steps, Math.round(st[i]) + Math.round(ln[i]));
    }
    steps = Math.max(1, Math.min(MAXSTEPS, Math.round(steps)));
    const notes = [];
    for (let i = 0; i < st.length; i++){
      if (!(fq[i] > 0)) continue;
      const step = Math.round(st[i]);
      if (step < 0 || step >= steps) continue;
      const len = Math.max(1, Math.round(ln[i]));
      notes.push({ step: step, len: Math.min(len, steps - step), midi: midiFromFreq(fq[i]), vol: 1, freq: fq[i], color: nextPaletteColor() });
    }
    return {
      bpm: bpm, steps: steps,
      gate: isFinite(gate) ? gate / 100 : NaN,
      duty: isFinite(duty) ? duty / 100 : NaN,
      pin: pin,
      activeNotes: notes
    };
  }

  // ---- legacy 1-row SONG[] format (0/1 = active beeper, Hz = passive) ----
  let steps = grabNum(/#define\s+SONG_STEPS\s+(\d+)/);
  const bodyM = t.match(/SONG\s*\[[^\]]*\]\s*(?:PROGMEM\s*)?=\s*\{([\s\S]*?)\};/);
  if (!bodyM) throw new Error('no SONG found');
  const nums = bodyM[1].replace(/\/\*[\s\S]*?\*\//g, ' ').split(/[^0-9]+/).filter(x => x !== '').map(Number);
  if (!nums.length) throw new Error('empty SONG');
  if (!isFinite(steps) || steps <= 0) steps = nums.length;
  steps = Math.max(1, Math.min(MAXSTEPS, Math.min(steps, nums.length)));
  const isActive = /ACTIVE mode/.test(t) || nums.every(v => v <= 1);
  const pattern = nums.slice(0, steps).map(v => isActive ? (v > 0 ? 72 : -1) : midiFromFreq(v));
  return {
    bpm: bpm, steps: steps,
    gate: isFinite(gate) ? gate / 100 : NaN,
    duty: isFinite(duty) ? duty / 100 : NaN,
    pin: pin,
    pattern: pattern
  };
}
function importIno(t){
  applyState(parseIno(t));
  return true;
}
function applyState(o){
  if (isFinite(o.bpm)) S.bpm = Math.max(40, Math.min(320, Math.round(o.bpm)));
  if (isFinite(o.steps)) S.steps = Math.max(1, Math.min(MAXSTEPS, Math.round(o.steps)));
  if (isFinite(o.gate)) S.gate = Math.max(.05, Math.min(1, o.gate));
  if (isFinite(o.duty)){
    const presets = [.125, .25, .5, .75];
    S.duty = presets.reduce((a, b) => Math.abs(b - o.duty) < Math.abs(a - o.duty) ? b : a);
  }
  if (isFinite(o.pin)) S.pin = Math.max(1, Math.min(48, Math.round(o.pin)));
  // reset data — passive note list
  activeNotes = [];
  selectedNote = null;
  if (Array.isArray(o.activeNotes)){
    for (const n of o.activeNotes){
      const m = Math.round(+n.midi);
      if (!isFinite(m)) continue;
      const fv = +n.freq;
      activeNotes.push({
        id: nextNoteId++,
        step: Math.max(0, Math.min(S.steps - 1, Math.round(+n.step) || 0)),
        len: Math.max(1, Math.min(S.steps, Math.round(+n.len || 1))),
        midi: clampM(m),
        vol: (isFinite(+n.vol) ? clamp(+n.vol, 0, 1) : 1),
        freq: (isFinite(fv) && fv > 0) ? fv : 0,
        color: (n.color != null && isFinite(+n.color)) ? (Math.round(+n.color) % PALETTE.length + PALETTE.length) % PALETTE.length : nextPaletteColor()
      });
    }
    // clamp lengths
    for (const n of activeNotes){
      if (n.step + n.len > S.steps) n.len = Math.max(1, S.steps - n.step);
    }
  } else if (Array.isArray(o.pattern)){
    // legacy per-step pattern: merge runs of the same pitch into held notes
    activeNotes = patToActiveNotes(o.pattern.map(v => (isFinite(+v) ? Math.round(+v) : -1)));
  }
  $('bpm').value = S.bpm; $('bpmOut').textContent = S.bpm + ' BPM';
  $('gate').value = Math.round(S.gate * 100); $('gateOut').textContent = Math.round(S.gate * 100) + ' %';
  $('duty').value = String(S.duty);
  $('pin').value = S.pin;
  cursorStep = Math.min(cursorStep, S.steps - 1);
  updateNotePanel();
  renderNoteList();
  syncStepsUI(); layout(); refreshAudio();
}$('codeBtn').onclick = () => {
  const b = $('codeBox');
  b.classList.toggle('open');
  $('codeBtn').classList.toggle('on', b.classList.contains('open'));
  if (b.classList.contains('open')) b.scrollIntoView({ behavior:'smooth', block:'nearest' });
};
$('copyBtn').onclick = () => {
  const txt = buildCode();
  const done = () => toast('code copied');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
};
function fallbackCopy(txt, cb){
  const ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch(e){ toast('copy failed', true); }
  ta.remove();
}

/* ============ PROJECT WIRING ============ */
$('plLibBtn').onclick = () => { if ($('projRail').hidden) openLibrary(); else closeLibrary(); };
$('plCloseBtn').onclick = closeLibrary;
$('plNewBtn').onclick = () => {
  newProject(nowLabel(), false);
  openLibrary();
};
$('plExportBtn').onclick = exportCurrentProject;
$('plImportBtn').onclick = openImportPickerAsNew;
$('plImportFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  importProjectFromFile(f);
});

// keyboard: P toggles project library
window.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT') return;
  if (e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    if ($('projRail') && !$('projRail').hidden) closeLibrary();
    else openLibrary();
  }
});

// wire controls to mark dirty on changes that affect the project
function wireDirty(id){
  const el = $(id);
  if (!el) return;
  const fn = () => markDirty();
  el.addEventListener('input', fn);
  el.addEventListener('change', fn);
}
wireDirty('bpm');
wireDirty('steps');
wireDirty('stepsR');
wireDirty('gate');
wireDirty('duty');
wireDirty('vol');
wireDirty('pin');
$('loopChk').addEventListener('change', () => { markDirty(); });
// note-panel edits are already triggering edit()/liveRestart(); also mark dirty there
$('nStep').addEventListener('change', () => { markDirty(); });
$('nLen').addEventListener('change', () => { markDirty(); });
$('nVol').addEventListener('change', () => { markDirty(); });
$('nDel').addEventListener('click', () => { markDirty(); });
$('rotL').onclick = () => { markDirty(); };
$('rotR').onclick = () => { markDirty(); };
$('octD').onclick = () => { markDirty(); };
$('octU').onclick = () => { markDirty(); };
$('randBtn').onclick = () => { markDirty(); };
$('clearBtn').onclick = () => { markDirty(); };


/* ============ RESIZE + BOOT ============ */
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { layout(); drawGrid(); }, 80); });

$('bpmOut').textContent = S.bpm + ' BPM';
$('gateOut').textContent = Math.round(S.gate * 100) + ' %';
$('volOut').textContent = Math.round(S.vol * 100);
// boot: restore last project if present, otherwise demo
(function boot(){
  let started = false;
  try {
    const lib = loadLibrary();
    PL.list = lib;
      if (lib.length > 0) {
      const last = lib[0];
      openProjectById(last.id, false);
      started = true;
    }
  } catch (e) { /* storage may be unavailable */ }
  if (!started) {
    // first run: open a fresh project, drop the demo into it, then save it
    newProject(nowLabel(), false);
    loadDemo();
    markDirty();
  }
  updateCurrentLabel();
  renderLibrary();
  applyUiMode();
  layout();
  updateStatus();
  buildCode();
  syncTransport();
  requestAnimationFrame(tick);
  setTimeout(() => { layout(); drawGrid(); }, 250);
  if (PL.currentId != null) {
    updateCurrentLabel();
    renderLibrary();
  }
})();
})();
</script>
